    </defs>
    <rect width="100%" height="100%" fill="url(#grad5)"/>
    <rect width="100%" height="100%" filter="url(#noise5)" opacity="0.4" mix-blend-mode="overlay"/>
    <circle cx="65%" cy="75%" r="20%" fill="#FF8A65" opacity="0.1" filter="blur(40px)"/>
  </svg>